{% set name = "openslide-python" %}
{% set version = "1.4.7" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_') }}-{{ version }}.tar.gz
  sha256: 730fed798de683b00c8ef4d956f3d429cc02f2c449eb0d58944e1769ba7983cc

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  build:
    - {{ compiler('c') }}
    - {{ stdlib("c") }}
    - python  # [build_platform != target_platform]
    - cross-python_{{ target_platform }}  # [build_platform != target_platform]
    - setuptools
  host:
    - pip
    - python
    - openslide
    - setuptools
  run:
    - pillow
    - python
    - openslide
    - setuptools

test:
  imports:
    - openslide

about:
  home: https://openslide.org/
  license: LGPL-2.1-only
  license_family: LGPL
  license_file: COPYING.LESSER
  summary: Python interface to OpenSlide

extra:
  recipe-maintainers:
    - sarthakpati
